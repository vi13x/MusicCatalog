server:
  port: ${PORT:8087}

logging:
  file:
    path: logs
  level:
    root: INFO
    com.example.musiccatalog: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb.core.internal.database.base.Database: ERROR

spring:
  application:
    name: music-catalog

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/music_catalog}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  async:
    bulk-track-delay-ms: 10000
    bulk-track-core-pool-size: 16
    bulk-track-max-pool-size: 32
    bulk-track-queue-capacity: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Music Catalog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 30px;
        }

        h1 {
            color: #1db954;
        }

        .track {
            background: #1e1e1e;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .track-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .duration {
            color: #aaa;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
        }
    </style>
</head>
<body>

<h1>Music Catalog</h1>

<div id="tracks"></div>

<script>
    async function loadTracks() {
        const response = await fetch('/api/tracks');
        const tracks = await response.json();

        const container = document.getElementById('tracks');
        container.innerHTML = '';

        tracks.forEach(track => {
            const div = document.createElement('div');
            div.className = 'track';

            div.innerHTML = `
                <div class="track-title">${track.title}</div>
                <div class="duration">Длительность: ${track.durationSec} сек.</div>
                ${
                track.audioUrl
                    ? `<audio controls src="${track.audioUrl}"></audio>`
                    : `<p>Аудио недоступно</p>`
            }
            `;

            container.appendChild(div);
        });
    }

    loadTracks();
</script>

</body>
</html>

name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-healthcheck:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: music_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d music_catalog"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/music_catalog
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 1234
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      - name: Build Docker image
        run: docker build -t music-catalog-app .

      - name: Start app with Docker Compose
        run: |
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=1234 \
          POSTGRES_DB=music_catalog \
          POSTGRES_PORT=5432 \
          APP_PORT=8087 \
          SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
          docker compose up -d --build

      - name: Wait for healthcheck
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8087/actuator/health; then
              echo "OK"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop Docker Compose
        if: always()
        run: |
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=1234 \
          POSTGRES_DB=music_catalog \
          POSTGRES_PORT=5432 \
          APP_PORT=8087 \
          SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
          docker compose down

  deploy:
    needs: build-test-healthcheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        run: curl "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

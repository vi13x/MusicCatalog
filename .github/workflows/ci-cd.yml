name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-healthcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x mvnw

      - name: Start app with Docker Compose
        run: |
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=1234 \
          POSTGRES_DB=music_catalog \
          POSTGRES_PORT=5432 \
          APP_PORT=8087 \
          SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
          docker compose up -d --build

      - name: Wait for healthcheck
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8087/actuator/health; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run tests
        run: ./mvnw clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/music_catalog
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 1234
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      - name: Stop Docker Compose
        if: always()
        run: |
          POSTGRES_USER=postgres \
          POSTGRES_PASSWORD=1234 \
          POSTGRES_DB=music_catalog \
          POSTGRES_PORT=5432 \
          APP_PORT=8087 \
          SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
          docker compose down

  deploy:
    needs: build-test-healthcheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        run: curl "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

            deploy:
    needs: build-test-healthcheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        run: curl "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
